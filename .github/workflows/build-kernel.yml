name: Build Lancelot Kernel (LineageOS 20)

on:
  push:
    branches:
      - lineage-20
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'arch/**'
      - 'drivers/**'
      - 'include/**'
      - 'kernel/**'
      - 'scripts/**'
      - 'Makefile'
      - 'Kconfig'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: lineage-20
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential flex gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi libssl-dev libelf-dev make \
            python3 python-is-python3 rsync zip

      - name: Configure kernel
        run: |
          make O=out ARCH=arm64 lancelot_defconfig

      - name: Build kernel
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb

      - name: Prepare AnyKernel3 installer
        run: |
          test -s out/arch/arm64/boot/Image.gz-dtb
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/

          # Customize AnyKernel3 for Lancelot and remove the upstream tuna demo patches.
          python3 - <<'PY'
          from pathlib import Path
          import re

          script = Path("anykernel/anykernel.sh")
          text = script.read_text()

          text = text.replace(
              "kernel.string=ExampleKernel by osm0sis @ xda-developers",
              "kernel.string=Lancelot LineageOS 20 Kernel"
          )
          text = text.replace("device.name1=maguro", "device.name1=lancelot")
          text = text.replace("device.name2=toro", "device.name2=")
          text = text.replace("device.name3=toroplus", "device.name3=")
          text = text.replace("device.name4=tuna", "device.name4=")

          text = text.replace(
              "BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;",
              "BLOCK=boot;"
          )

          # Keep AnyKernel3's normal boot unpack/repack/flash flow, but remove
          # demo ramdisk edits intended for the unrelated Galaxy Nexus.
          text = re.sub(
              r"dump_boot;[^\n]*\n.*?^write_boot;[^\n]*",
              "dump_boot;\n\nwrite_boot;",
              text,
              count=1,
              flags=re.DOTALL | re.MULTILINE
          )
          script.write_text(text)
          PY

      - name: Package AnyKernel3 flashable ZIP
        run: |
          mkdir -p artifact
          cp out/.config artifact/kernel-config
          printf 'Source branch: lineage-20\n' > artifact/BUILD-INFO.txt
          printf 'Commit: %s\n' "$GITHUB_SHA" >> artifact/BUILD-INFO.txt

          cd anykernel
          zip -r9 ../artifact/Lancelot-Lineage20-AnyKernel3.zip . \
            -x '.git/*' 'README.md' '*placeholder*'

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lancelot-lineage20-anykernel3
          path: artifact/Lancelot-Lineage20-AnyKernel3.zip
          if-no-files-found: error
          retention-days: 14
